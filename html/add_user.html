<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drive-me-addUser</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://cdn.jsdelivr.net/; connect-src 'self' https://holidays-jp.github.io/; img-src 'self' * data:">
    <link rel="stylesheet" href="../src/css/add_user.css">
    <link rel="stylesheet" href="@bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid d-flex align-items-center justify-content-center" id="window-container">
        <div>
            <h1 id="title" class="text-center mb-5">新規ユーザー情報を入力してください</h1>

            <form>
                <div class="row mb-5">
                    <label class="col-sm-2 col-form-label">ユーザー名</label>
                    <div class="col-sm-10">
                        <input class="form-control" id="new-username-input" type="text">
                    </div>
                </div>

                <div class="row mb-2">
                    <label class="col-sm-2 col-form-label">パスワード</label>
                    <div class="col-sm-10">
                        <input id="new-user-password-input" class="form-control" type="password">
                    </div>
                </div>

                <div class="row">
                    <label class="col-sm-2 col-form-label">パスワード（確認）</label>
                    <div class="col-sm-10">
                        <input id="new-user-password-confirmation-input" type="password" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <label for="role" class="col-sm-2 col-form-label">権限</label>
                    <div class="col-sm-10">
                        <select class="form-select" name="role" id="role-select">
                            <option value="part-time">アルバイト</option>
                            <option value="employee">社員</option>
                            <option value="admin">管理職</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button id="submit-button" class="btn btn-primary">登録</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="@bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../src/renderer_process/add_user.ts"></script>
</body>

</html>
